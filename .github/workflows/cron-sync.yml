name: Cron - Sync Pedidos Gestor

on:
  schedule:
    # NOTE: GitHub cron uses UTC. Times below assume America/Sao_Paulo (UTC-3).
    - cron: "*/10 10-21 * * 1-5"
    - cron: "*/10 10-14 * * 6"
    - cron: "0 15 * * 6"
  workflow_dispatch: {}

jobs:
  call-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        env:
          BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_BASE_URL or CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$BASE_URL/api/ops/pedidos/gestor/sync"
